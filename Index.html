<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiplangat registration</title>
    <link rel="stylesheet" href="index.css">
    <link href="home.html">
</head>
<body class="body">
    <form action="/register" method="post">
        <h1>Registration Details</h1>
        <p>
            <label for="Full Name">Full Name</label>
            <input type="text" id="fullname" name="fullname">
        </p>
        <p> 
            <label for="admno">Admission number</label>
            <input type="text" id="admno" name="admo" placeholder="Your Admission Number">
        </p>
        <p>
            <label for="email">Email</label>
            <input type="text" id="email" name="email">
        </p>
        <p>
            <label for="dateofbirth">Date of Birth</label>
            <input type="date" id="dateofbirth" name="dateofbirth">
        </p>
        <P>
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone">
        </P>
        <p>
            <label for="gender">Gender</label>
            <input type="radio" id="gender" name="gender">Male 
            <input type="radio" id="gender" name="gender">Female
            <input type="radio" id="gender" name="gender">Prefer not to say
        </p>
        <p>
            <label for="color">Favorite Color</label>
            <input type="color">
        </p>
        <p>
            <label for="satisfaction">Satisfaction</label>
            <input type="range">
        </p>
        <p>
            <label for="modeofstudy">Mode Of Study</label>
            <input type="checkbox">Full Time 
             <input type="checkbox">Part Time
              <input type="checkbox">Distance learning
        </p>
        <p>
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
        </p>       
         <fieldset class="field">
            <legend>Year of Study</legend>
            <label><input type="radio" name="year" value="1"> Year 1</label>
            <label><input type="radio" name="year" value="2"> Year 2</label>
            <label><input type="radio" name="year" value="3"> Year 3</label>
            <label><input type="radio" name="year" value="4"> Year 4</label>
        </fieldset>
        <fieldset class="field">
         <legend>Intrest</legend>
            <label><input type="checkbox" name="intrest" value="1"> Web</label>
            <label><input type="checkbox" name="intrest" value="2"> Mobile</label>
            <label><input type="checkbox" name="intrest" value="3"> Data</label>
            <label><input type="checkbox" name="intrest" value="4"> Security</label>    
        </fieldset>
        <p>
            <input type="checkbox">I agree to the terms
        </p>
        <p>
            <label for="programme">Programme</label>
            <select id="programe" name="programme">
                <option value="">Choose a programme</option>
                <option value="bit"> BSc information technology</option>
                <option value="bsd">BSc Softrware Development</option>
                <option value="dip">Diploma in ICT</option>
            </select>
        </p>
        <P>
            <label for="county">Home County</label>
            <iput type="text" id="county" name="county" aria-placeholder="your county" list="county-list"></iput>    
                <datalist id="county-list">
                    <option value="Nairobi">
                </datalist>
                    
        </select>
        </P>
        <P>
            <button type="submit"><a href="home.html">Register</a></button>
        </P>
    </form>
</body>
</html>
